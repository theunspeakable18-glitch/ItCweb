<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="istyles.css">
    <link rel="stylesheet" href="auth-styles.css?v=2">
</head>
<body>
    <div class="sign">
        <a href="index.html" class="auth__back">&larr; Back to home</a>
        <div class="sign__container">
            <div class="sign__content">
                <h1>GitGud</h1>
                <p class="auth__tagline">Welcome back. Your next session is waiting.</p>
                <div class="sign__box">
                    <form id="loginForm">
                        <h2>Log in</h2>
                        <div class="input__box">
                            <input type="email" id="email" placeholder="Email" required autocomplete="username">
                        </div>

                        <div class="input__box input__box--pw">
                            <input type="password" id="password" class="auth__pw" placeholder="Password" required autocomplete="current-password">
                            <button type="button" class="auth__eye" data-target="password" aria-label="Show password">Show</button>
                        </div>
                        <p class="auth__caps" hidden>Caps Lock is on</p>

                        <div class="remember-forgot">
                            <label title="Stay logged in on this device"><input type="checkbox" id="rememberMe"> Remember Me</label>
                            <a href="#" id="forgotLink">Forgot Password</a>
                        </div>

                        <button type="submit" class="sign__btn" id="submitBtn">Log in</button>

                        <div class="register-link">
                            <p>don't have an account? <a href="signup.html">Register</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="security.js"></script>
    <script src="auth-ui.js"></script>
    <script src="script.js"></script>

</body>
</html>
